<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal website of Jingxuan Zhang">
    <meta name="author" content="Jingxuan Zhang">
    <title>Jingxuan Zhang</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #657086;
        --accent: #3157d5;
        --paper: #f6f7fb;
        --card: rgba(255, 255, 255, 0.82);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 12%, #dfe7ff 0, transparent 34%),
          radial-gradient(circle at 88% 82%, #e4f3ee 0, transparent 32%),
          var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 80px rgba(35, 48, 80, 0.12);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 44ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        padding: 12px 18px;
        border-radius: 999px;
        color: white;
        background: var(--ink);
        font-weight: 650;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }

      a:hover { transform: translateY(-2px); background: var(--accent); }
      a:focus-visible { outline: 3px solid #9fb2ff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Personal website</p>
      <h1>Jingxuan<br>Zhang</h1>
      <p>This site is being updated. Research, projects, and contact information will be added soon.</p>
      <a href="https://github.com/JingxuanZhangg" aria-label="View Jingxuan Zhang on GitHub">GitHub <span aria-hidden="true">&#8599;</span></a>
    </main>
  </body>
</html>
